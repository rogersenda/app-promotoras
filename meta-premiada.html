<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Meta Premiada</title>
<style>:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--mu:#6b7280;--ln:#e6e8ec;--pri:#c1121f;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-size:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
a{color:var(--pri)}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.wrap.w{max-width:1150px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:17px;margin-bottom:10px}
.card h3{font-size:15px;margin:14px 0 8px}
.mu{color:var(--mu);font-size:13px}
.hero{background:linear-gradient(135deg,var(--pri),#111);color:#fff;padding:28px 18px 26px;text-align:center}
.hero .br{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;font-weight:700}
.hero h1{font-size:28px;margin:8px 0 6px;line-height:1.15}
.hero p{opacity:.92}
.hero .per{display:inline-block;margin-top:12px;background:rgba(255,255,255,.16);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;text-decoration:none}
.btn.full{width:100%}
.btn.sec{background:#eef0f3;color:var(--ink)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:10px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;border:1px solid #d1d5db;border-radius:9px;padding:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
label.f textarea{min-height:90px}
input:disabled,select:disabled{background:#f3f4f6!important;color:#6b7280}
label.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0;cursor:pointer}
label.ck input{width:20px;height:20px;flex:0 0 auto;margin-top:1px}
.steps{display:grid;gap:10px}
.step{display:flex;gap:12px;align-items:flex-start}
.step b.n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln);vertical-align:top}
th{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em}
.tbl{overflow-x:auto}
.chip{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;background:#eef0f3;color:#374151;white-space:nowrap}
.chip.pendente{background:#fef3c7;color:#92400e}.chip.aprovado,.chip.ativa,.chip.entregue{background:#dcfce7;color:#166534}.chip.recusado{background:#fee2e2;color:#991b1b}
.chip.negociando{background:#e0e7ff;color:#3730a3}.chip.fechado{background:#fae8ff;color:#86198f}.chip.faturado{background:#cffafe;color:#155e75}.chip.encerrada{background:#e5e7eb;color:#374151}
.bar{height:12px;background:#eef0f3;border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.big{font-size:26px;font-weight:800}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.okb{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.warnb{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.upl{display:block;border:2px dashed #cbd5e1;border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--mu);font-weight:600}
.upl img{max-width:100%;max-height:280px;border-radius:8px}
.demo{background:#111;color:#fde047;text-align:center;font-size:12px;font-weight:700;padding:5px}
.top{background:#0f1115;color:#fff;padding:10px 14px;position:sticky;top:0;z-index:20}
.top .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .t{font-weight:800;flex:1}
.top select{background:#1a1d24;color:#fff;border:1px solid #2a2e37;border-radius:8px;padding:7px 9px;font-size:14px;max-width:260px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid #2a2e37;background:#1a1d24;color:#cfd3da;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:#fff;color:#111}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px}
.kpi .l{font-size:12px;color:var(--mu);font-weight:600}
.hb{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.hb span:first-child{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{flex:1;margin:0}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 10px}
.modal{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:560px;position:relative}
.modal.wide{max-width:900px}
.mx{position:absolute;right:10px;top:8px;border:none;background:none;font-size:28px;cursor:pointer;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:90vw}
.cup{display:grid;grid-template-columns:200px 1fr;gap:14px}
.cup img{width:100%;border-radius:8px;border:1px solid var(--ln);cursor:zoom-in}
@media(max-width:640px){.cup{grid-template-columns:1fr}}
.erow{display:grid;gap:6px;align-items:center;margin-bottom:6px}
.erow input{border:1px solid #d1d5db;border-radius:8px;padding:8px;font-size:14px;width:100%;min-width:0}
.rmv{border:none;background:#fee2e2;color:#991b1b;border-radius:8px;width:32px;height:34px;cursor:pointer;font-weight:800}
.fx{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.fx:last-child{border:none}
.fx.on{font-weight:700;color:var(--pri)}
.pdv{max-width:780px;margin:0 auto;background:#fff;padding:28px;text-align:center}
.pdv h1{font-size:40px;color:var(--pri);margin:8px 0}
.pdv .fxp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.pdv .fxp>div{border:2px solid var(--pri);border-radius:12px;padding:12px}
.foot{text-align:center;padding:24px 0 40px}
.foot a{color:var(--mu);font-size:12px}
@media print{.noprint{display:none!important}body{background:#fff}}
</style></head><body><div id="app"><div class="wrap"><p class="mu">Carregando…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ===================== CONFIGURAÇÃO ONLINE =====================
// Deixe em branco para usar o MODO DEMONSTRAÇÃO (dados ficam só neste aparelho).
// Para a campanha real, crie um projeto no Supabase, rode meta-premiada-supabase.sql
// e cole aqui a URL do projeto e a chave "anon public" (Settings > API).
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';
// ===============================================================

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dig=s=>String(s||'').replace(/\D/g,'');
const iso=()=>new Date().toISOString();
const hoje=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fd=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const fdt=s=>s?new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'';
const clone=o=>JSON.parse(JSON.stringify(o));
const num=s=>{s=String(s??'').trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0};
const fCPF=c=>(c=dig(c)).length===11?c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):c;
const fCNPJ=c=>(c=dig(c)).length===14?c.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):c;
const fTel=t=>(t=dig(t)).length>=10?t.replace(/(\d{2})(\d{4,5})(\d{4})/,'($1) $2-$3'):t;
function cpfOk(c){c=dig(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+c[i]*(t+1-i);if((s*10)%11%10!==+c[t])return false}return true}
function cnpjOk(c){c=dig(c);if(c.length!==14||/^(\d)\1+$/.test(c))return false;const k=n=>{let w=n-7,s=0;for(let i=0;i<n;i++){s+=+c[i]*w--;if(w<2)w=9}const r=s%11;return r<2?0:11-r};return k(12)===+c[12]&&k(13)===+c[13]}
const UF={11:'RO',12:'AC',13:'AM',14:'RR',15:'PA',16:'AP',17:'TO',21:'MA',22:'PI',23:'CE',24:'RN',25:'PB',26:'PE',27:'AL',28:'SE',29:'BA',31:'MG',32:'ES',33:'RJ',35:'SP',41:'PR',42:'SC',43:'RS',50:'MS',51:'MT',52:'GO',53:'DF'};
const STATUS_REDE={negociando:'Negociando',fechado:'Pedido fechado',faturado:'Pedido faturado',ativa:'Ativa na campanha',encerrada:'Encerrada'};
const STATUS_CUP={pendente:'Em análise',aprovado:'Aprovado',recusado:'Recusado'};

// ---------- Cupom fiscal: chave de acesso (NFC-e 65, SAT 59, NF-e 55) ----------
function chaveDV(ch){let s=0,w=2;for(let i=42;i>=0;i--){s+=+ch[i]*w;w=w===9?2:w+1}const r=s%11;return r<2?0:11-r}
function parseChave(raw){const m=String(raw||'').replace(/\s/g,'').match(/(?<!\d)\d{44}(?!\d)/);if(!m)return null;const ch=m[0],mod=ch.slice(20,22);
  return{chave:ch,uf:UF[ch.slice(0,2)]||ch.slice(0,2),ano:2000+ +ch.slice(2,4),mes:+ch.slice(4,6),cnpj:ch.slice(6,20),modelo:mod,dvOk:chaveDV(ch)===+ch[43],numero:mod==='59'?ch.slice(31,37):ch.slice(25,34)}}
// Lê o conteúdo do QR: SAT traz data, valor e CPF; NFC-e em contingência traz o valor total.
function parseQR(txt){const info={raw:txt,ch:parseChave(txt)};if(!info.ch)return info;
  const p=String(txt).split('|');
  if(/^\d{44}$/.test(p[0])&&/^\d{14}$/.test(p[1]||'')){info.data=`${p[1].slice(0,4)}-${p[1].slice(4,6)}-${p[1].slice(6,8)}`;info.total=num(p[2]);info.cpf=dig(p[3])}
  else{const q=String(txt).split('p=')[1];if(q){const pp=q.split('|');if(pp.length>=8&&/^\d{1,2}$/.test(pp[3]||''))info.total=num(pp[4])}}
  return info}
function gerarChave(cnpj,data){const [y,m]=data.split('-');const r=n=>Array.from({length:n},()=>Math.floor(Math.random()*10)).join('');const b='35'+y.slice(2)+m+cnpj+'65'+'001'+r(9)+'1'+r(8);return b+chaveDV(b)}

// ---------- Faixas e progresso ----------
const ordF=f=>(f||[]).slice().sort((a,b)=>a.min-b.min);
function faixaDe(total,faixas){let f=null;for(const x of ordF(faixas))if(total>=x.min)f=x;return f}
function proxFaixa(total,faixas){return ordF(faixas).find(x=>total<x.min)||null}
const aprov=c=>c.status==='aprovado'?(+c.valorAprovado||0):0;

// ---------- Formatos, verba e sorteio ----------
const FORMATOS={faixas:'Compre e Ganhe',sorteio:'Compre e Concorra',ambos:'Ganhe + Concorra'};
const FORMATO_DESC={faixas:'Bateu a meta, ganhou: prêmio garantido por faixa de compra. Não depende de autorização de sorteio.',sorteio:'Cada valor de compra vira 1 número da sorte e os prêmios são sorteados pela Loteria Federal. Exige autorização prévia da SPA/MF.',ambos:'Faixas com prêmio garantido e, além disso, números da sorte para o sorteio. Exige autorização prévia da SPA/MF.'};
const fmt=c=>c?.formato||(c?.sorteio?.ativo?'ambos':'faixas');
const temFaixas=c=>fmt(c)!=='sorteio', temSorteio=c=>fmt(c)!=='faixas';
const VERBA={pct_extra:'Percentual do pedido extra',pct_total:'Percentual do pedido total',fixo:'Valor fixo (R$)'};
function verbaDe(r){const ex=Math.max(0,(+r.pedidoCampanha||0)-(+r.pedidoBase||0)),t=r.verbaTipo||'pct_extra';return t==='fixo'?(+r.verbaValor||0):t==='pct_total'?(+r.pedidoCampanha||0)*(+r.verbaPct||0)/100:ex*(+r.verbaPct||0)/100}
function custoPremios(r,c){return(temFaixas(c)?(r.faixas||[]).reduce((s,f)=>s+(+f.custo||0)*(+f.qtd||0),0):0)+(temSorteio(c)?(r.premiosSorteio||[]).reduce((s,p)=>s+(+p.custo||0)*(+p.qtd||1),0):0)}
const mascCPF=c=>(c=dig(c)).length===11?`***.${c.slice(3,6)}.${c.slice(6,9)}-**`:'***';
const mascNome=n=>{const p=String(n||'').trim().split(/\s+/);return p[0]+(p[1]?' '+p[1][0]+'.':'')};
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
// Texto canônico da lista pública (mesma regra no app e no banco): rede|número|CPF mascarado, em ordem.
const linhasLista=L=>L.slice().sort((a,b)=>a.redeId.localeCompare(b.redeId)||a.n.localeCompare(b.n)).map(x=>`${x.redeId}|${x.n}|${x.cpf}`).join('\n');
// Apuração: posição inicial = 1º prêmio da Loteria Federal mod total de números da rede; prêmios seguintes nos próximos números, 1 por CPF.
function apurar(pool,base,qtd){const P=pool.slice().sort((a,b)=>a.n.localeCompare(b.n));if(!P.length)return{pos:null,ganh:[]};const pos=Number(base)%P.length,ganh=[],usados=new Set();
  for(let i=0;i<P.length&&ganh.length<qtd;i++){const x=P[(pos+i)%P.length];if(usados.has(x.key))continue;usados.add(x.key);ganh.push(x)}return{pos,ganh}}
const expandePremios=ps=>(ps||[]).flatMap(p=>Array(Math.max(1,Math.round(+p.qtd||1))).fill(p.premio));
function calcNumeros(cu,ca,C){const v=+ca?.sorteio?.valorPorNumero||0;if(!temSorteio(ca)||!(v>0)||ca.sorteio?.congelado)return[];
  const ou=C.filter(z=>z.id!==cu.id&&z.campId===cu.campId&&z.clienteId===cu.clienteId&&z.redeId===cu.redeId&&z.status==='aprovado');
  const tot=ou.reduce((s,z)=>s+aprov(z),0)+(+cu.valorAprovado||0),tem=ou.reduce((s,z)=>s+(z.numeros||[]).length,0);
  let seq=Math.max(0,...C.filter(z=>z.campId===cu.campId).flatMap(z=>(z.numeros||[]).map(Number)));
  return Array.from({length:Math.max(0,Math.floor(tot/v)-tem)},()=>String(++seq).padStart(6,'0'))}
function resultadoHTML(c,redes){const R=c.sorteio?.resultados;if(!R)return'';
  return`<div class="okb"><b>Resultado do sorteio</b> — Loteria Federal, concurso ${esc(R.extracao)} de ${fd(R.dataExtracao)} · 1º prêmio: <b>${esc(R.base)}</b></div>`+Object.entries(R.redes||{}).map(([rid,x])=>{const r=redes.find(z=>z.id===rid);
    return`<h3>${esc(r?.nome||rid)}</h3><p class="mu">${x.total} números · ${esc(R.base)} ÷ ${x.total} deixa resto ${x.pos} → começa no ${x.pos+1}º número da lista em ordem crescente</p><div class="tbl"><table><tr><th>Prêmio</th><th>Número</th><th>Ganhador</th></tr>${x.ganhadores.map(g=>`<tr><td>${esc(g.premio)}</td><td><b>${esc(g.n)}</b></td><td>${esc(g.nome)} · ${esc(g.cpf)}</td></tr>`).join('')}</table></div>`}).join('')}

// ---------- Armazenamento: modo demonstração ----------
const Demo={k:t=>'mp_demo_'+t,
  all(t){try{return JSON.parse(localStorage.getItem(this.k(t))||'[]')}catch(e){return[]}},
  save(t,r){try{localStorage.setItem(this.k(t),JSON.stringify(r))}catch(e){throw new Error('Memória do navegador cheia (modo demonstração). Apague os dados de demonstração em Campanhas › Configurações gerais.')}},
  put(t,row){const r=this.all(t),i=r.findIndex(x=>x.id===row.id);if(i>=0)r[i]=row;else r.push(row);this.save(t,r);return row},
  del(t,id){this.save(t,this.all(t).filter(x=>x.id!==id))}};
const pubRede=r=>({id:r.id,campId:r.campId,nome:r.nome,status:r.status,ativadaEm:r.ativadaEm,faixas:r.faixas||[],premiosSorteio:r.premiosSorteio||[],lojas:(r.lojas||[]).map(l=>({id:l.id,nome:l.nome,cnpj:l.cnpj,cidade:l.cidade}))});
const DemoAPI={mode:'demo',
  async init(){if(!Demo.all('config').length)seedDemo()},
  async getConfig(){return Demo.all('config')[0]||{}},
  async campanhas(){return Demo.all('campanhas')},
  async redesPublicas(c){return Demo.all('redes').filter(r=>r.campId===c&&['ativa','encerrada'].includes(r.status)).map(pubRede)},
  async cadastrar(cli){if(Demo.all('clientes').some(x=>x.cpf===cli.cpf))throw new Error('CPF_JA_CADASTRADO');return Demo.put('clientes',cli)},
  async login(cpf,nasc){return Demo.all('clientes').find(x=>x.cpf===cpf&&x.nascimento===nasc)||null},
  async meusDados(cpf,nasc){const c=await this.login(cpf,nasc);if(!c)return null;return{cliente:c,cupons:Demo.all('cupons').filter(x=>x.clienteId===c.id).map(x=>({...x,foto:null}))}},
  async enviarCupom(cpf,nasc,cup){const c=await this.login(cpf,nasc);if(!c)throw new Error('SESSAO');if(Demo.all('cupons').some(x=>x.chave===cup.chave))throw new Error('CUPOM_JA_USADO');cup.clienteId=c.id;return Demo.put('cupons',cup)},
  async uploadFoto(d){return d}, async fotoSrc(r){return r},
  async adminLogin(nome,pin){const cfg=await this.getConfig();if(pin!==(cfg.pinDemo||'1234'))throw new Error('PIN incorreto');const a={nome:nome||'Equipe',email:''};sessionStorage.setItem('mp_admin',JSON.stringify(a));return a},
  async adminSession(){try{return JSON.parse(sessionStorage.getItem('mp_admin'))}catch(e){return null}},
  async adminLogout(){sessionStorage.removeItem('mp_admin')},
  async numerosPublicos(c){const cl=Demo.all('clientes');return Demo.all('cupons').filter(x=>x.campId===c&&x.status==='aprovado').flatMap(x=>{const k=cl.find(z=>z.id===x.clienteId)||{};return(x.numeros||[]).map(n=>({redeId:x.redeId,n,nome:mascNome(k.nome),cpf:mascCPF(k.cpf)}))})},
  async aprovarCupom(id,valor,por){const C=Demo.all('cupons'),cu=C.find(x=>x.id===id),ca=Demo.all('campanhas').find(x=>x.id===cu.campId);if(cu.status==='aprovado')throw new Error('Cupom já aprovado');Object.assign(cu,{status:'aprovado',valorAprovado:valor,motivo:'',analisadoPor:por,analisadoEm:iso()});cu.numeros=calcNumeros(cu,ca,C);return Demo.put('cupons',cu)},
  async list(t){return Demo.all(t)}, async put(t,r){return Demo.put(t,r)}, async del(t,id){Demo.del(t,id)}};

// ---------- Armazenamento: modo online (Supabase) ----------
const loadScript=src=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('Falha ao carregar '+src));document.head.appendChild(s)});
const SbAPI={mode:'online',
  ok({data,error}){if(error)throw new Error(error.message);return data},
  async init(){await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');this.c=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)},
  async getConfig(){const d=this.ok(await this.c.from('mp_config').select('data').eq('id','geral').maybeSingle());return d?.data||{appNome:'Meta Premiada'}},

function modeloRegulamento(c){const m=(c.marcas||[]).map(x=>x.nome).join(' e ')||'[marcas]',v=brl(c.sorteio?.valorPorNumero);

  ['QUEM PODE PARTICIPAR','Pessoas físicas maiores de 18 anos, com CPF válido. Não podem participar funcionários das lojas participantes nem da promotora.'],
  ['COMO PARTICIPAR',`a) Comprar produtos ${m} em uma loja participante${c.exigirCpfNaNota?', informando o CPF na nota':''};
b) Cadastrar-se no aplicativo e enviar a foto do cupom fiscal, informando o valor gasto em produtos ${m};
c) Os valores aprovados são somados por rede de lojas. Cada cupom só pode ser cadastrado uma vez.`]];
  if(temFaixas(c))S.push(['FAIXAS E PRÊMIOS GARANTIDOS',`Ao atingir o valor de uma faixa, o participante garante o prêmio correspondente. Faixas de referência:
${ordF(c.faixasPadrao).map(f=>`   • ${f.nome}: a partir de ${brl(f.min)} — ${f.premio}`).join('\n')}
As faixas e quantidades de cada rede ficam publicadas no aplicativo e não mudam depois que a rede entra na campanha. Cada CPF recebe o prêmio da maior faixa atingida em cada rede. Os prêmios são limitados às quantidades informadas, por ordem de atingimento da faixa.`]);
  if(temSorteio(c))S.push(['NÚMEROS DA SORTE E SORTEIO',`Promoção autorizada pela SPA/MF — Certificado de Autorização nº ${c.sorteio?.autorizacao||'[NÚMERO]'}.
a) A cada ${v} aprovados em compras numa mesma rede, o participante recebe 1 número da sorte, sequencial, exibido no aplicativo.
b) Encerrado o período e analisados todos os cupons, a lista de números é congelada e publicada no aplicativo (nome abreviado e CPF parcial), com código de verificação SHA-256.
c) A apuração ocorrerá em ${c.sorteio?.dataSorteio?fd(c.sorteio.dataSorteio):'[DATA]'} com base no 1º prêmio da extração da Loteria Federal indicada no certificado. Em cada rede, os números são ordenados de forma crescente; o primeiro contemplado ocupa a posição dada pelo resto da divisão do 1º prêmio pelo total de números da rede, mais 1. Os demais prêmios vão para os números seguintes da lista, limitado a 1 prêmio por CPF em cada rede.
d) Os prêmios sorteados de cada rede ficam publicados no aplicativo.
(Ajustar este item à forma de apuração aprovada no certificado de autorização.)`]);
  S.push(['VALIDAÇÃO DOS CUPONS',`Os cupons são conferidos pela equipe da promotora. Serão recusados cupons ilegíveis, de lojas não participantes, fora do período, ${c.exigirCpfNaNota?'sem o CPF do participante na nota, ':''}com valor divergente ou com indícios de fraude. Todas as análises ficam registradas.`],
  ['ENTREGA DOS PRÊMIOS',c.entregaInfo||'[Como e onde os prêmios serão entregues]'],

  ['DISPOSIÇÕES GERAIS','Dúvidas e casos omissos serão resolvidos pela promotora. Ao participar, o consumidor declara concordar com este regulamento.']);
  return`REGULAMENTO — ${c.nome} (${FORMATOS[fmt(c)]})
(MODELO — revisar com o jurídico antes de publicar)

`+S.map(([t,b],i)=>`${i+1}. ${t}\n${b}`).join('\n\n')}

async function loadImg(src){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=src})}
async function comprimir(file){const url=URL.createObjectURL(file);try{const i=await loadImg(url);const k=Math.min(1,1400/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);return{dataUrl:c.toDataURL('image/jpeg',.72),img:i}}finally{setTimeout(()=>URL.revokeObjectURL(url),5000)}}
async function lerQR(img){
  try{if('BarcodeDetector' in window){const r=await new BarcodeDetector({formats:['qr_code']}).detect(img);if(r[0])return r[0].rawValue}}catch(e){}
  if(!window.jsQR)return null;
  for(const max of [1000,1600,700]){const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height);const r=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(r)return r.data}
  return null}

function cupomFake(loja,dt,vl,cpf,url,camp){const c=document.createElement('canvas');c.width=420;c.height=760;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,420,760);x.fillStyle='#111';x.font='bold 16px monospace';
  const L=(t,y,b)=>{x.font=(b?'bold ':'')+'14px monospace';x.fillText(t,20,y)};L(loja.nome.slice(0,40),40,1);L('CNPJ '+fCNPJ(loja.cnpj),60);L('DOCUMENTO AUXILIAR DA NFC-e',90,1);L('-'.repeat(42),110);
  const m=(camp.marcas||[]).map(z=>z.nome.toUpperCase());let y=135,rest=vl;m.forEach((n,i)=>{const v=i===m.length-1?rest:Math.round(vl*0.6*100)/100;rest=Math.round((rest-v)*100)/100;L(`ITEM ${n}`.padEnd(30)+v.toFixed(2).padStart(10),y);y+=22});
  L('ALGODAO 100G'.padEnd(30)+'12.90'.padStart(10),y);y+=22;L('-'.repeat(42),y);y+=24;L('TOTAL R$'.padEnd(30)+(vl+12.9).toFixed(2).padStart(10),y,1);y+=26;L('CPF CONSUMIDOR: '+fCPF(cpf),y);y+=22;L('EMISSAO: '+fd(dt),y);

  x.fillStyle='#b91c1c';x.font='bold 16px sans-serif';x.fillText('CUPOM DE DEMONSTRAÇÃO — SEM VALOR',40,oy+n*cs+40);return c.toDataURL('image/jpeg',.85)}

    const br=$('#bReset');if(br)br.onclick=()=>{if(!confirm('Apagar TODOS os dados de demonstração deste aparelho e recomeçar com o exemplo?'))return;Object.keys(localStorage).filter(k=>k.startsWith('mp_demo_')||k==='mp_sess').forEach(k=>localStorage.removeItem(k));seedDemo();location.reload()}},
  editCamp(c,nova){const temCup=!nova&&this.d.cupons.some(x=>x.campId===c.id),cong=!!c.sorteio?.congelado,vp=c.verbaPadrao||{tipo:'pct_extra',pct:10,valor:0};

      if(!o.criadaEm)o.criadaEm=iso();await this.save('campanhas',o);await this.log(nova?'campanha_criada':'campanha_editada',o.nome,`${FORMATOS[fmt(o)]} · ${fd(o.inicio)} a ${fd(o.fim)} · ${o.status}${fmt(c)!==fmt(o)&&!nova?' · formato alterado de '+FORMATOS[fmt(c)]:''}`);
      if(o.status==='ativa'&&temSorteio(o)&&!o.sorteio.autorizacao)toast('Atenção: sorteio sem nº de autorização (permitido só na demonstração).');else toast('Campanha salva');
      this.campId=o.id;closeModal();this.render()}},

  // ----- AUDITORIA -----
  t_audit(el){const A=this.d.audit.filter(a=>!a.campId||a.campId===this.campId).sort((a,b)=>b.em.localeCompare(a.em));
    el.innerHTML=`<div class="card"><div class="row" style="align-items:center"><h2 style="margin:0">Auditoria</h2><div style="flex:0 0 auto"><button class="btn sm sec" id="bEA">Exportar CSV</button></div></div><p class="mu" style="margin-top:6px">Registro de quem fez o quê e quando: aprovações, recusas, mudanças de rede e faixas, entregas de prêmio e exportações da base de clientes.</p></div>
    <div class="card tbl"><table><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Sobre</th><th>Detalhe</th></tr>${A.slice(0,500).map(a=>`<tr><td>${fdt(a.em)}</td><td>${esc(a.por)}</td><td>${esc(a.acao.replace(/_/g,' '))}</td><td>${esc(a.alvo)}</td><td class="mu">${esc(a.det)}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">Sem registros.</td></tr>'}</table></div>`;
    $('#bEA').onclick=()=>csv(`auditoria-${this.campId}.csv`,[['Quando','Quem','Ação','Sobre','Detalhe'],...A.map(a=>[fdt(a.em),a.por,a.acao,a.alvo,a.det])])}
};

(async()=>{try{await api.init();S.cfg=await api.getConfig()||{};document.title=S.cfg.appNome||'Meta Premiada'}catch(e){app.innerHTML=`<div class="wrap"><div class="err">Não foi possível conectar: ${esc(e.message)}</div></div>`;return}
  window.addEventListener('hashchange',route);route()})();
